name: CI
on:
  push: { branches: [main, master] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: drillex, MYSQL_USER: drillex, MYSQL_PASSWORD: drillex, MYSQL_DATABASE: drillex }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u drillex -pdrillex --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://drillex:drillex@127.0.0.1:3306/drillex
      JWT_ACCESS_SECRET: ci
      JWT_REFRESH_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @drillex/api prisma generate
      - run: pnpm --filter @drillex/api prisma migrate deploy
      - run: pnpm --filter @drillex/api db:seed
        env: { DATABASE_URL: "mysql://drillex:drillex@127.0.0.1:3306/drillex" }
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @drillex/api --filter @drillex/web build
