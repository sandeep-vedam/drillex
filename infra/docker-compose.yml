services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: drillex
      MYSQL_USER: drillex
      MYSQL_PASSWORD: drillex
      MYSQL_DATABASE: drillex
    ports: ["3306:3306"]
    volumes: [mysqldata:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: drillex
      MINIO_ROOT_PASSWORD: drillex123
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  mysqldata:
  miniodata:
