# No-domain variant: exposes API/web directly by server IP over plain HTTP, no Caddy/TLS.
# Use this when you don't have a domain yet. Switch to docker-compose.prod.yml (+ Caddy) once you do.
#   docker compose -f infra/docker-compose.prod-ip.yml --env-file infra/.env.prod-ip up -d --build
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: drillex
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: drillex
    volumes: [mysqldata:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u drillex -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redisdata:/data]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [miniodata:/data]

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    ports: ["4000:4000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    environment:
      DATABASE_URL: mysql://drillex:${MYSQL_PASSWORD}@mysql:3306/drillex
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: drillex
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      PORT: 4000
      PUBLIC_API_URL: http://${SERVER_IP}:4000
      DEVICE_REGISTRATION_REQUIRED: ${DEVICE_REGISTRATION_REQUIRED:-true}
      CORS_ORIGINS: http://${SERVER_IP}
      NODE_ENV: production

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${SERVER_IP}:4000/api/v1
    restart: unless-stopped
    ports: ["80:3000"]
    depends_on: [api]

volumes:
  mysqldata:
  redisdata:
  miniodata:
