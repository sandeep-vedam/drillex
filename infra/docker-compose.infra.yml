# Stateful infra only (MySQL, Redis, MinIO) — for when the API/web run as bare Node
# processes via PM2 + nginx instead of in containers. Ports bind to 127.0.0.1 only;
# the app processes run on the same host and reach these via localhost.
#   docker compose -f infra/docker-compose.infra.yml --env-file infra/.env.prod-ip up -d
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: drillex
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: drillex
    ports: ["127.0.0.1:3306:3306"]
    volumes: [mysqldata:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u drillex -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

volumes:
  mysqldata:
  redisdata:
  miniodata:
